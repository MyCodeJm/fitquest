{% extends "base.html" %}
{% block title %}Sign in - FitQuest{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>🏆 FitQuest</h1>
  <p class="muted">Sign in to pick up where you left off.</p>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus maxlength="40">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
</div>
{% endblock %}
