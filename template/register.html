{% extends "base.html" %}
{% block title %}Create account - FitQuest{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>🏆 FitQuest</h1>
  <p class="muted">Create an account - your progress is saved to the database, not just this browser.</p>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form">
    <label for="display_name">Display name</label>
    <input id="display_name" name="display_name" type="text" maxlength="20" placeholder="Player One">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus maxlength="40">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8">
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already have one? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
