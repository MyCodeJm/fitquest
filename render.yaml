services:
  - type: web
    name: fitquest
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitquest-db
          property: connectionString

databases:
  - name: fitquest-db
    plan: free
